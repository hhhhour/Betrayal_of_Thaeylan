#define BOT_ABILITY_RESOLUTE
    # Increases resistance for all
    [resistance]
        id=bot_resolute
        add=10
        # applies to any type if we leave it out
        #apply_to=blade,pierce,impact,fire,cold,arcane
        [filter_base_value]
            less_than=50
        [/filter_base_value]
        name= _ "resolute"
        female_name= _ "female^resolute"
        description= _ "This unit’s resistances are increased by 10% when defending."
        special_note= _ "The resolve of this unit reduces damage from some attacks, but only while defending."
        affect_self=yes
        active_on=defense
    [/resistance]
#enddef

#define BOT_AMULET_URAN
    # Increases cold resistance
    [resistance]
        id=bot_amulet_uran
        add=10
        apply_to=cold
        [filter_base_value]
            less_than=50
        [/filter_base_value]
        name= _ "amulet"
        female_name= _ "female^amulet"
        description= _ "This unit’s resistances to cold damage are increased by 10%."
        affect_self=yes
    [/resistance]
#enddef
